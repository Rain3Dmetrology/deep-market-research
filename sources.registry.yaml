# dmr source health registry
#
# Every external URL uses a $ENV_VAR placeholder -- no secret is ever
# hard-coded. A source whose $ENV_VAR is unset is SKIPPED (not penalised).
#
# layer:
#   default    -> core zero-config research backbone; if DEAD/REGRESSED it
#                 counts as an "uncovered dimension" (open_issue+mark_uncovered)
#   optional   -> key-gated / platform-specific enhancement; death is backoff+log
#   deprecated -> probe skipped; must NOT be referenced as an active route
#
# needs_key: whether a credential is required to probe (embedded as $ENV_VAR).

# --- default layer (zero-config free APIs) ---------------------------------
arxiv:
  name: arXiv
  url: https://export.arxiv.org/api/query?search_query=all:electron&max_results=1
  layer: default
  needs_key: false

semantic_scholar:
  name: Semantic Scholar
  url: https://api.semanticscholar.org/graph/v1/paper/search?query=electron&limit=1
  layer: default
  needs_key: false

crossref:
  name: Crossref
  url: https://api.crossref.org/works?query=electron&rows=1
  layer: default
  needs_key: false

openalex:
  name: OpenAlex
  url: https://api.openalex.org/works?search=electron&per-page=1
  layer: default
  needs_key: false

huggingface:
  name: Hugging Face
  url: https://huggingface.co/api/models?limit=1
  layer: default
  needs_key: false

github:
  name: GitHub
  url: https://api.github.com/rate_limit
  layer: default
  needs_key: false

# --- optional layer (key-gated / platform-specific) -------------------------
modelscope:
  name: ModelScope
  url: https://modelscope.cn/api/v1/models?PageSize=1&PageNumber=1&access_token=$MODELSCOPE_TOKEN
  layer: optional
  needs_key: true

reddit:
  name: Reddit
  url: https://www.reddit.com/r/all/hot.json?limit=1&raw_json=1
  layer: optional
  needs_key: false

hn:
  name: Hacker News
  url: https://hn.algolia.com/api/v1/search?query=electron&tags=story&hitsPerPage=1
  layer: optional
  needs_key: false

twitter_x:
  name: Twitter/X
  url: https://api.x.com/2/tweets/search/recent?query=electron&max_results=10
  layer: optional
  needs_key: true
  probe_type: custom
  auth: 'Authorization: Bearer $TWITTER_BEARER_TOKEN（请求头认证）'
  note: >-
    M3 修正（v2.8）：X API v2 域名已迁 api.x.com（api.twitter.com 旧域）；认证为请求头
    Bearer，凭据不再拼入 query。现有 _http_probe 仅支持 URL 探针、无法表达头部认证，
    故按自定义探针（probe_type: custom）标注：有凭据时输出 SKIPPED 而非伪造一个可通过的
    探针，待后续探针机制支持头部认证后再启用。

firecrawl:
  name: Firecrawl
  url: https://api.firecrawl.dev/v1/search?auth=$FIRECRAWL_API_KEY
  layer: optional
  needs_key: true

exa:
  name: Exa
  url: https://api.exa.ai/search?api_key=$EXA_API_KEY
  layer: optional
  needs_key: true

tavily:
  name: Tavily
  url: https://api.tavily.com/search?api_key=$TAVILY_API_KEY
  layer: optional
  needs_key: true

zhihu:
  name: Zhihu
  url: https://api.zhihu.com/search?q=electron&api_key=$ZHIHU_TOKEN
  layer: optional
  needs_key: true

patsnap:
  name: Patsnap
  url: https://api.patsnap.com/search?api_key=$PATSNAP_TOKEN
  layer: optional
  needs_key: true

connected_papers:
  name: Connected Papers
  url: https://www.connectedpapers.com/api/v1/paper/search?query=electron&api_key=$CONNECTED_PAPERS_TOKEN
  layer: optional
  needs_key: true

fred:
  name: FRED
  url: https://api.stlouisfed.org/fred/series?series_id=GNPCA&api_key=$FRED_API_KEY
  layer: optional
  needs_key: true
  note: '宏观维度不进 dimensions_uncovered；死亡仅 backoff+log；宏观已由 WebSearch 无 key 覆盖'

# --- AgentKey（v2.8 / 审计 T-03：仅 MCP 接入，需 MCP 型健康检查分支）--------
agentkey:
  name: AgentKey
  url: https://api.agentkey.app/v1/mcp
  layer: optional
  needs_key: true
  probe_type: mcp
  auth_env: AGENTKEY_API_KEY
  auth: 'Bearer（Authorization 请求头）: $AGENTKEY_API_KEY'
  note: >-
    闭源商业 SaaS（Chainbase / Chainbase Technology Holdings Pte. Ltd. 运营；无 MIT 许可、
    无公开版本号——审计对方引用的“MIT 许可 / 1.14.0 版本号”已经直测证伪剔除）。工具总数约 2000（官方口径 "2,000+"，
    2026-08-29 凭据直测实测 1981，11 个顶层节点）：社交 1213（25 个子平台）/ 金融 311 / 链上 179。
    计费为订阅外壳 + 积分按量混合：免费档赠 10 积分，Lite/Pro/Max 月订阅含月度积分、可加购、不滚存；
    免费额度有限（实测 key 已耗 65%、余 3.5 积分），实际数据调用需付费档。仅 MCP 接入
    （Streamable HTTP，JSON-RPC 2.0 initialize/tools 握手），无 REST/文档面。健康探测走
    source_health._mcp_probe 最小 initialize 握手，不消耗积分；无凭据时 SKIPPED 不误判。
    时效限定：社交类目中 linkedin/threads 官方健康探测自报不健康（截至 2026-08-29 实测）。
    路由纪律：搜索/抓取意图优先直连，AgentKey 仅作未配置直连时的兜底或社媒类目命中时触发。

# --- deprecated (probe skipped; must not be referenced as active route) -----
midu_hotsearch:
  name: midu HotSearch
  url: https://www.midu.com/api/hotsearch?app_secret=$MIDU_APP_SECRET
  layer: deprecated
  status: DEPRECATED
  needs_key: true
  note: '新版 midu.com 改 OAuth + 付费墙，MIDU_APP_SECRET 失效，信源已弃用'

wechat_mp_rss:
  name: WeChat MP RSS
  url: https://wechat-mp.example.com/rss?token=$WECHAT_MP_TOKEN
  layer: deprecated
  status: DEPRECATED
  needs_key: true
  note: '微信公众账号文章改走 wechat-article-search skill + ReadGZH-Agent MCP，旧 RSS 桥接弃用'
